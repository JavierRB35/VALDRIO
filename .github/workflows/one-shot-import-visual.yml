name: one-shot-pr39-visual-only

on:
  push:
    branches: [feature/import-same-currency-only-20261012]
    paths: [.github/workflows/one-shot-import-visual.yml]
permissions:
  contents: read
jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Publish WPF
        shell: pwsh
        run: dotnet publish src/Valdrio.Desktop/Valdrio.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/desktop
      - name: Run every guided WPF interaction and capture visual evidence
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/desktop/Valdrio.Desktop.exe').Path
          $sample = (Resolve-Path 'samples/t01-smoke.valdrio-dev.json').Path
          New-Item -Force -ItemType Directory -Path 'artifacts/visual' | Out-Null
          $capture = (Resolve-Path 'artifacts/visual').Path
          $process = Start-Process -FilePath $exe -WindowStyle Hidden -ArgumentList @($sample, "--capture-dir=$capture") -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path 'artifacts/visual/company-failure.txt') {
              Get-Content 'artifacts/visual/company-failure.txt' | Write-Host
            }
            throw "WPF visual verification failed with exit code $($process.ExitCode)"
          }
          if (-not (Test-Path 'artifacts/visual/guided-workflow/interaction.json')) {
            throw 'Guided workflow receipt not generated'
          }
      - name: Visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr39-visual-quick
          path: artifacts/visual
          if-no-files-found: ignore
          retention-days: 2

# Targeted T08 smoke regression: incomplete percentage permits draft, never publication.
