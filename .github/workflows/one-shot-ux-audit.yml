name: one-shot-ux-real-user-audit
on:
  push:
    branches: [fix/ux-real-user-audit-20261012]
    paths: [.github/workflows/one-shot-ux-audit.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Full Windows acceptance, WPF real screens and unit tests
        shell: pwsh
        run: ./.github/scripts/Verify-Windows.ps1
      - name: Capture visual and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-visual-acceptance
          path: |
            artifacts/visual/
            artifacts/acceptance-build.json
            tests/Valdrio.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 3

# Re-run after correcting WPF warning-as-error and Dispatcher.Yield qualification.
