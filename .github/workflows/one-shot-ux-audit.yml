name: one-shot-ux-audit-windows-verification
on:
  push:
    branches: [feature/ux-audit-improvements-20261012]
    paths: [.github/workflows/one-shot-ux-audit.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build, run all tests and existing WPF acceptance
        shell: pwsh
        run: ./.github/scripts/Verify-Windows.ps1
      - name: Keep evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-windows-evidence
          path: |
            artifacts/visual
            artifacts/acceptance-build.json
            tests/Valdrio.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 4

# Re-run after bulk allocation command and import interpretation improvements.
