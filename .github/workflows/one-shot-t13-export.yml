name: one-shot-t13-native-project-export

on:
  push:
    branches:
      - feature/t13-synthetic-projects-20261011
    paths:
      - .github/workflows/one-shot-t13-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VALDRIO_T13_EXPORT_DIR: ${{ github.workspace }}/Synthetic Projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Generate and test actual VALDRIO companies
        shell: pwsh
        run: |
          dotnet restore tests/Valdrio.Tests/Valdrio.Tests.csproj
          dotnet test tests/Valdrio.Tests/Valdrio.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~T13_' --logger 'trx;LogFileName=t13-generated.trx'
      - name: Inspect and commit native examples
        shell: pwsh
        run: |
          $projects = @(
            'Synthetic Projects/Service Company/services.valdrio',
            'Synthetic Projects/Industrial Company/industrial.valdrio',
            'Synthetic Projects/Service Company/frozen-snapshot.json',
            'Synthetic Projects/Industrial Company/frozen-snapshot.json'
          )
          foreach ($project in $projects) {
            if (-not (Test-Path -LiteralPath $project)) { throw "T13 native fixture is missing: $project" }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          foreach ($project in $projects) { git add -f -- $project }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Git staged diff is invalid' }
          git commit -m 'T13: include executable SQLite company examples and frozen receipts'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit T13 generated binaries' }
          git push origin HEAD:refs/heads/feature/t13-synthetic-projects-20261011
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish T13 native examples' }
      - name: Upload native fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t13-native-projects-versioned
          path: |
            Synthetic Projects/Service Company/*.valdrio
            Synthetic Projects/Industrial Company/*.valdrio
            Synthetic Projects/*/frozen-snapshot.json
            tests/Valdrio.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 3
