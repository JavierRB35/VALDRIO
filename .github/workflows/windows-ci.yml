name: windows-ci

on:
  push:
    branches:
      - main
    paths: &validation_paths
      - 'src/**'
      - 'tests/**'
      - 'reference/**'
      - 'samples/**'
      - 'specification/**'
      - '.github/workflows/windows-ci.yml'
      - '.github/scripts/**'
      - '*.slnx'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - '**/NuGet.Config'
      - '**/nuget.config'
      - '**/packages.lock.json'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *validation_paths
  workflow_dispatch:
    inputs:
      publish_development:
        description: 'Upload the Windows development binary'
        type: boolean
        default: false
      verify_timezones:
        description: 'Verify UTC and Europe/Madrid in separate processes'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
          check-latest: false
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json

      - name: SDK info
        shell: pwsh
        run: dotnet --info

      - name: Restore
        shell: pwsh
        run: dotnet restore Valdrio.slnx

      - name: Verify canonical specification sources
        shell: pwsh
        run: |
          Push-Location specification/v0.4
          try {
            $checked = 0
            $errors = @()

            foreach ($line in Get-Content SHA256SUMS.txt) {
              if ([string]::IsNullOrWhiteSpace($line)) {
                continue
              }

              $parts = $line -split '\s+', 2
              $expected = $parts[0].ToLowerInvariant()
              $relative = $parts[1].Trim()

              if ($relative.EndsWith('.pdf', [StringComparison]::OrdinalIgnoreCase)) {
                continue
              }

              if (-not (Test-Path -LiteralPath $relative -PathType Leaf)) {
                $errors += "Missing canonical source: $relative"
                continue
              }

              $actual = (Get-FileHash -LiteralPath $relative -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                $errors += "SHA-256 mismatch: $relative expected=$expected actual=$actual"
                continue
              }

              $checked++
            }

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_ }
              throw "Canonical specification verification failed."
            }

            Write-Host "Canonical specification sources verified: $checked text/JSON/Python files."
          }
          finally {
            Pop-Location
          }

      - name: Run canonical mathematical reference verifier
        shell: pwsh
        run: |
          python --version
          python specification/v0.4/casos/verificar_referencias.py specification/v0.4/casos/casos_metodologicos.json


      - name: Build
        shell: pwsh
        run: dotnet build Valdrio.slnx --configuration Release --no-restore

      - name: Test
        id: tests
        shell: pwsh
        run: dotnet test tests/Valdrio.Tests/Valdrio.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=valdrio-tests.trx"

      - name: Upload test results
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: valdrio-test-failure
          path: tests/Valdrio.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 1

      - name: Guard diagnostic resource coverage
        shell: pwsh
        run: |
          $sourceFiles = Get-ChildItem src/Valdrio.Domain,src/Valdrio.Calculation,src/Valdrio.Application,src/Valdrio.Infrastructure,src/Valdrio.Desktop -Recurse -Filter *.cs |
            Where-Object { $_.FullName -notmatch '[\\\\/](obj|bin)[\\\\/]' -and $_.Name -ne 'AssemblyInfo.cs' }
          # AssemblyInfo only declares assembly attributes, including the test friend assembly.
          $pattern = '"(?<key>[A-Z][A-Za-z0-9]*(?:\.[A-Z][A-Za-z0-9]*)+)"'

          $keys = @(
            foreach ($file in $sourceFiles) {
              foreach ($match in (Select-String -Path $file.FullName -Pattern $pattern -AllMatches -CaseSensitive).Matches) {
                $match.Groups['key'].Value
              }
            }
          ) | Sort-Object -Unique

          [xml]$englishXml = Get-Content src/Valdrio.Localization/Resources/Strings.resx -Raw
          [xml]$spanishXml = Get-Content src/Valdrio.Localization/Resources/Strings.es.resx -Raw

          $englishKeys = @($englishXml.root.data | ForEach-Object { $_.name })
          $spanishKeys = @($spanishXml.root.data | ForEach-Object { $_.name })

          $missingEnglish = @($keys | Where-Object { $_ -notin $englishKeys })
          $missingSpanish = @($keys | Where-Object { $_ -notin $spanishKeys })

          if ($missingEnglish.Count -gt 0 -or $missingSpanish.Count -gt 0) {
            Write-Host "Missing English diagnostic keys: $($missingEnglish -join ', ')"
            Write-Host "Missing Spanish diagnostic keys: $($missingSpanish -join ', ')"
            throw "Diagnostic resources do not cover production message keys."
          }

          Write-Host "Diagnostic resource coverage passed for $($keys.Count) production keys."

      - name: Guard economic code against binary floating point
        shell: pwsh
        run: |
          $hits = Get-ChildItem src/Valdrio.Domain,src/Valdrio.Calculation -Recurse -Filter *.cs |
            Select-String -Pattern '\b(double|float)\b'

          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line }
            throw "Domain/Calculation contains double or float."
          }

      - name: Runner T02 reference corpus
        shell: pwsh
        run: dotnet run --project src/Valdrio.Runner/Valdrio.Runner.csproj --configuration Release --no-build -- --verify-t02-reference

      - name: Runner T02A currency metadata
        shell: pwsh
        run: dotnet run --project src/Valdrio.Runner/Valdrio.Runner.csproj --configuration Release --no-build -- --verify-t02a-currency

      - name: Guard core against ambient current time
        shell: pwsh
        run: |
          $hits = Get-ChildItem src/Valdrio.Domain,src/Valdrio.Calculation,src/Valdrio.Application -Recurse -Filter *.cs |
            Select-String -Pattern 'DateTime\.(Now|UtcNow)|DateTimeOffset\.(Now|UtcNow)'

          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line }
            throw "Domain/Calculation/Application reads ambient current time directly; use IClock."
          }

      - name: Runner T02A temporal contracts
        shell: pwsh
        run: dotnet run --project src/Valdrio.Runner/Valdrio.Runner.csproj --configuration Release --no-build -- --verify-t02a-time

      - name: Runner T02A frozen FX
        shell: pwsh
        run: dotnet run --project src/Valdrio.Runner/Valdrio.Runner.csproj --configuration Release --no-build -- --verify-t02a-fx

      - name: Guard Calculation against network APIs
        shell: pwsh
        run: |
          $hits = Get-ChildItem src/Valdrio.Calculation -Recurse -Filter *.cs |
            Where-Object { $_.FullName -notmatch '[\\/](obj|bin)[\\/]' } |
            Select-String -Pattern 'HttpClient|System\.Net\.|WebRequest|Socket'

          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line }
            throw "Calculation references network APIs."
          }

      - name: Publish self-contained Windows x64 development artifact
        shell: pwsh
        run: dotnet publish src/Valdrio.Desktop/Valdrio.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/desktop

      - name: WPF launch smoke
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/desktop/Valdrio.Desktop.exe").Path
          $sample = (Resolve-Path "samples/t01-smoke.valdrio-dev.json").Path
          $process = Start-Process -FilePath $exe -ArgumentList @($sample) -PassThru

          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) {
              throw "VALDRIO WPF exited during smoke test with code $($process.ExitCode)."
            }

            Write-Host "WPF launch smoke passed. Process remained alive for 6 seconds."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: WPF invalid-preferences recovery smoke
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/desktop/Valdrio.Desktop.exe").Path
          $sample = (Resolve-Path "samples/t01-smoke.valdrio-dev.json").Path
          $invalidPreferences = Join-Path $env:RUNNER_TEMP "valdrio-invalid-preferences.json"

          @'
          {
            "UiLanguageTag": "en",
            "FormatCultureTag": "en-US",
            "DisplayTimeZoneId": "Invalid/ReviewZone",
            "DateDisplayPreset": 999,
            "NumberDisplayOptions": null
          }
          '@ | Set-Content -Path $invalidPreferences -Encoding utf8NoBOM

          $process = Start-Process -FilePath $exe -ArgumentList @(
            $sample,
            "--preferences-path=$invalidPreferences"
          ) -PassThru

          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "VALDRIO exited while recovering invalid presentation preferences with code $($process.ExitCode)."
            }

            Write-Host "WPF invalid-preferences recovery passed. Process remained alive for 5 seconds."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Bind acceptance manifest to build outputs
        shell: pwsh
        run: ./.github/scripts/Verify-Windows.ps1 -PrepareBuildManifestOnly

      - name: Generate WPF visual evidence
        id: visual_evidence
        shell: pwsh
        run: ./.github/scripts/Verify-Windows.ps1 -UseExistingBuild

      - name: Upload development artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_development
        uses: actions/upload-artifact@v7
        with:
          name: valdrio-t01-win-x64
          path: artifacts/desktop
          if-no-files-found: error
          retention-days: 1

      - name: Upload WPF visual evidence
        if: always() && steps.visual_evidence.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: valdrio-wpf-visual-evidence
          path: |
            artifacts/visual
            artifacts/acceptance-build.json
            tests/Valdrio.Tests/TestResults/*.trx
          # Includes the actual FX button interaction checks.
          if-no-files-found: error
          retention-days: 1


  temporal-zone-invariance:
    needs: build-test-publish
    if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.verify_timezones) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
          check-latest: false
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
            global.json

      - name: Restore and build the portable tests once
        shell: bash
        run: |
          dotnet restore tests/Valdrio.Tests/Valdrio.Tests.csproj
          dotnet build tests/Valdrio.Tests/Valdrio.Tests.csproj --configuration Release --no-restore

      - name: R01 and persisted files under both process timezones
        shell: bash
        run: |
          set -euo pipefail
          for timezone in UTC Europe/Madrid; do
            TZ="$timezone" dotnet test tests/Valdrio.Tests/Valdrio.Tests.csproj \
              --configuration Release --no-build --no-restore \
              --filter "FullyQualifiedName~RepositoryReviewRegressionTests.R01_|FullyQualifiedName~T03CompanyFileTests|FullyQualifiedName~T04ModelTests|FullyQualifiedName~T05StudyTests"
          done
