name: windows-ci

on:
  push:
    branches:
      - main
      - "t00/**"
      - "t01/**"
      - "t01a/**"
      - "t02/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: SDK info
        shell: pwsh
        run: dotnet --info

      - name: Restore
        shell: pwsh
        run: dotnet restore Valdrio.slnx

      - name: Build
        shell: pwsh
        run: dotnet build Valdrio.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test tests/Valdrio.Tests/Valdrio.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=valdrio-tests.trx"

      - name: Guard economic code against binary floating point
        shell: pwsh
        run: |
          $hits = Get-ChildItem src/Valdrio.Domain,src/Valdrio.Calculation -Recurse -Filter *.cs |
            Select-String -Pattern '\b(double|float)\b'

          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line }
            throw "Domain/Calculation contains double or float."
          }

      - name: Runner T02 reference corpus
        shell: pwsh
        run: dotnet run --project src/Valdrio.Runner/Valdrio.Runner.csproj --configuration Release --no-build -- --verify-t02-reference

      - name: Publish self-contained Windows x64 development artifact
        shell: pwsh
        run: dotnet publish src/Valdrio.Desktop/Valdrio.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/desktop

      - name: WPF launch smoke
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/desktop/Valdrio.Desktop.exe").Path
          $sample = (Resolve-Path "samples/t01-smoke.valdrio-dev.json").Path
          $process = Start-Process -FilePath $exe -ArgumentList @($sample) -PassThru

          try {
            Start-Sleep -Seconds 6
            if ($process.HasExited) {
              throw "VALDRIO WPF exited during smoke test with code $($process.ExitCode)."
            }

            Write-Host "WPF launch smoke passed. Process remained alive for 6 seconds."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Generate T01A visual evidence
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/desktop/Valdrio.Desktop.exe").Path
          $sample = (Resolve-Path "samples/t01-smoke.valdrio-dev.json").Path
          $captureDir = Join-Path $PWD "artifacts/visual"
          New-Item -ItemType Directory -Force -Path $captureDir | Out-Null

          $process = Start-Process -FilePath $exe -ArgumentList @(
            $sample,
            "--capture-dir=$captureDir"
          ) -PassThru -Wait

          if ($process.ExitCode -ne 0) {
            throw "Visual evidence process failed with code $($process.ExitCode)."
          }

          $files = Get-ChildItem -Path $captureDir -Filter *.png
          if ($files.Count -ne 4) {
            throw "Expected 4 visual evidence PNG files, found $($files.Count)."
          }

          $files | ForEach-Object {
            Write-Host "Visual evidence: $($_.Name) $($_.Length) bytes"
          }

      - name: Upload development artifact
        uses: actions/upload-artifact@v7
        with:
          name: valdrio-t01-win-x64
          path: artifacts/desktop
          if-no-files-found: error
          retention-days: 14

      - name: Upload T01A visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: valdrio-t01a-visual-evidence
          path: artifacts/visual/*.png
          if-no-files-found: error
          retention-days: 14
