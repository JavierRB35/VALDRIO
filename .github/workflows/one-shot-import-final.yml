name: final-pr39-windows-acceptance

on:
  push:
    branches: [feature/import-same-currency-only-20261012]
    paths: [.github/workflows/one-shot-import-final.yml]
permissions:
  contents: read
jobs:
  full-validation:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Full Windows acceptance
        shell: pwsh
        run: ./.github/scripts/Verify-Windows.ps1
      - name: Acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-import-acceptance
          path: |
            artifacts/visual
            artifacts/acceptance-build.json
            tests/Valdrio.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 3
