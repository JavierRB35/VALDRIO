name: one-shot-windows-import-validation

on:
  push:
    branches:
      - feature/import-same-currency-only-20261012
    paths:
      - .github/workflows/one-shot-import-validation.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Full VALDRIO Windows acceptance
        shell: pwsh
        run: ./.github/scripts/Verify-Windows.ps1
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-import-evidence
          path: |
            artifacts/visual
            artifacts/acceptance-build.json
            tests/Valdrio.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 2

