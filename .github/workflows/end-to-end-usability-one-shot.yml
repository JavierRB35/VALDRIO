name: end-to-end-usability-one-shot

on:
  push:
    branches:
      - codex/end-to-end-usability-audit
    paths:
      - .github/workflows/end-to-end-usability-one-shot.yml

permissions:
  contents: read

concurrency:
  group: end-to-end-usability-one-shot
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    if: contains(github.event.head_commit.message, '[audit-ci]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        shell: pwsh
        run: dotnet restore Valdrio.slnx

      - name: Build Release
        shell: pwsh
        run: dotnet build Valdrio.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test tests/Valdrio.Tests/Valdrio.Tests.csproj --configuration Release --no-build --no-restore
