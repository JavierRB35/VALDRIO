name: pr25-one-shot-windows-build

on:
  push:
    branches:
      - codex/model-editor-usability
    paths:
      - .github/workflows/pr25-one-shot-windows-build.yml

permissions:
  contents: read

concurrency:
  group: pr25-one-shot-windows-build
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    if: contains(github.event.head_commit.message, '[pr25-ci]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        shell: pwsh
        run: dotnet restore Valdrio.slnx

      - name: Build Release
        shell: pwsh
        run: dotnet build Valdrio.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test tests/Valdrio.Tests/Valdrio.Tests.csproj --configuration Release --no-build --no-restore
